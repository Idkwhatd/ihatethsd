plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lockscreenchanger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lockscreenchanger'
        // Android 7.0 is the first version with a separate lock screen wallpaper API.
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        // Checked-in debug key, so a build from any machine can update the app already installed.
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
