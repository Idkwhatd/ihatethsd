plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lockscreenchanger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lockscreenchanger'
        // Android 7.0 is the first version with a separate lock screen wallpaper API.
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
